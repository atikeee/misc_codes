output:
  directory: ""          # "" = same folder as source RAW file

jpeg:
  quality: 95            # 85-97 recommended  (95 = near-lossless)
  subsampling: 0         # 0=4:4:4 (best)  1=4:2:2  2=4:2:0
  optimize: true
  embed_icc_profile: true

colour:
  brightness:  1.2      # 1.0 = neutral  | raise for brighter output
  contrast:    1.1      # 1.0 = neutral  | slight punch for portraits
  saturation:  1.15      # 1.0 = neutral  | warm skin tones
  sharpening:  1         # 0=off  1=mild  2=stronger

# RAW exposure (applied during demosaicing - more accurate than Pillow brightness)
# bright:    1.3         # set in code - tweak here to override
# exp_shift: 0.5         # 0.0-3.0, highlight-safe exposure shift

logging:
  level: INFO            # INFO or DEBUG
  log_file: conversion.log